name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Static syntax check
        run: |
          python -m py_compile transaction_producer.py bronze_consumer.py market_data_producer.py market_bronze_consumer.py bronze_to_silver.py silver_to_gold.py dashboard.py pipeline_runner.py

      - name: Run tests
        run: pytest -q
